aid: vertigis
name: VertiGIS
description: >-
  VertiGIS is a geographic information systems (GIS) software provider that builds
  tools helping utilities, telecommunications, energy, public sector, and land
  management organizations connect their business processes with location technology.
  Its flagship VertiGIS Studio suite (formerly Geocortex) extends Esri ArcGIS with
  low-code applications for web and mobile mapping, report generation, printing, and
  business-process automation. VertiGIS exposes a developer platform of JavaScript,
  TypeScript, C#, and Python SDKs plus a hosted Reporting REST API for automating
  report and print jobs, documented at the VertiGIS Studio Developer Center. VertiGIS
  was assembled by Battery Ventures around Latitude Geographics and operates a
  portfolio of GIS brands including Geocortex, GEONIS, WebOffice, ProOffice, UT for
  ArcGIS, 3A for ArcGIS, and ConnectMaster.
