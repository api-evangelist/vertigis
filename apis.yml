apis:
- name: VertiGIS Studio Reporting REST API
  description: >-
    The VertiGIS Studio Reporting REST API generates reports and printed maps from
    spatial and non-spatial data. Jobs are submitted, polled, and their artifacts
    retrieved over HTTP; first-party JavaScript and Python client libraries wrap the
    same endpoints. Reporting runs against a hosted multi-tenant service or an
    on-premises VertiGIS Studio Reporting deployment.
  humanURL: https://developers.vertigisstudio.com/docs/reporting/sdk-overview/
